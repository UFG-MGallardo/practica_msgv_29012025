<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Login</title>
</head>
<body>
    <form name="form_login" id="form_login" method="post" action="https//mail.google.com/">
        <input type="text" name="txt_user" id="txt_user" maxlength="10" required/>
        <input type="password" name="txt_pass" id="txt_pass" maxlength="20" required/>
        <br>
        <button name="btn_enviar" id="btn_enviar" value="enviar">Enviar Datos</button>
        <button name="btn_cancelar" id="btn_cancelar" value="cancelar">Cancelar</button>
    </form>
</body>
</html>
